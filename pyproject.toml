[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chronic-pain-nlp"
version = "0.1.0"
description = "Rule-based extraction of chronic pain concepts from clinical text"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Chronic Pain NLP contributors"}]
keywords = ["clinical-nlp", "pain", "medical-nlp", "text-extraction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "medspacy>=1.2,<2",
  "pandas>=2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
app = ["streamlit>=1.36,<2"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.5", "streamlit>=1.36,<2"]

[project.urls]
Repository = ""
Issues = ""

[tool.hatch.build.targets.wheel]
packages = ["src/chronic_pain_nlp"]

[tool.hatch.build]
include = ["src/chronic_pain_nlp/**/*.py", "src/chronic_pain_nlp/rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
